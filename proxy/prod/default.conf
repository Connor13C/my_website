# Allow 10 requests/second per IP, using 10MB of shared memory for tracking
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Stricter zone for login endpoints - 1 request/second per IP
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

# Hide Nginx version from error pages and headers
server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    access_log	/var/log/nginx/access.log;
    error_log	/var/log/nginx/error.log;

    # Include global deny rules
    include /etc/nginx/server-deny.conf;

    location / {
        limit_except GET POST PUT DELETE PATCH {
            deny all;
        }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log	/var/log/nginx/access.log;
    error_log	/var/log/nginx/error.log;

    # Include global ssl config
    include /etc/nginx/server-ssl-config.conf;

    # Include global deny rules
    include /etc/nginx/server-deny.conf;

    location / {
        limit_except GET POST PUT DELETE PATCH {
            deny all;
        }
        return 301 https://www.connorbcarey.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.*;
    access_log	/var/log/nginx/access.log;
    error_log	/var/log/nginx/error.log;

    # Include global ssl config
    include /etc/nginx/server-ssl-config.conf;

    # Include global deny rules
    include /etc/nginx/server-deny.conf;

    location / {
        # Include global proxy config and restrictions
        include /etc/nginx/location-proxy.conf;

        proxy_pass          http://app_main:5000/;
    }
}

server {
    listen 443 ssl;
    server_name django.*;
    access_log	/var/log/nginx/app1_access.log;
    error_log	/var/log/nginx/app1_error.log;

    # Include global ssl config
    include /etc/nginx/server-ssl-config.conf;

    # Include global deny rules
    include /etc/nginx/server-deny.conf;

    location /static/ {
        alias /var/www/app1/static/;
    }

    location / {
        # Include global proxy config and restrictions
        include /etc/nginx/location-proxy.conf;

        proxy_pass          http://app1:5000/;
    }
}

